<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobility - 회원 관리</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
    <h2 class="mb-4">회원 관리</h2>

    <form th:action="@{/admin/members}" method="get" class="row g-2 mb-3">
        <div class="col-auto">
            <input type="text" name="keyword" th:value="${param.keyword}" class="form-control"
                   placeholder="이름 / 아이디 / 이메일 / 전화번호 검색">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary">검색</button>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>아이디</th>
                <th>이름</th>
                <th>이메일</th>
                <th>전화번호</th>
                <th>권한</th>
                <th>상태</th>
                <th>가입일</th>
                <th>관리</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${members.content}">
                <td th:text="${m.id}">1</td>
                <td th:text="${m.userid}">userid</td>
                <td th:text="${m.name}">이름</td>
                <td th:text="${m.email}">email</td>
                <td th:text="${m.tel}">tel</td>
                <td>
                    <span class="badge"
                          th:classappend="${m.role.name() == 'ADMIN'} ? 'badge-role-admin' : 'badge-role-user'"
                          th:text="${m.role}">USER</span>
                </td>
                <td>
                    <span class="badge" th:classappend="${m.enabled} ? 'bg-success' : 'bg-secondary'"
                          th:text="${m.enabled} ? '활성' : '비활성'">활성</span>
                </td>
                <td th:text="${#temporals.format(m.createdAt, 'yyyy-MM-dd')}">2026-01-01</td>
                <td>
                    <div class="d-flex gap-1">
                        <form th:action="@{'/admin/members/toggle/' + ${m.id}}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-secondary"
                                    th:text="${m.enabled} ? '비활성화' : '활성화'">비활성화</button>
                        </form>
                        <form th:action="@{'/admin/members/del/' + ${m.id}}" method="post"
                              onsubmit="return confirm('정말 삭제하시겠습니까?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">삭제</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${members.empty}">
                <td colspan="9" class="text-center text-muted py-4">등록된 회원이 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${members.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${members.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/admin/members(page=${members.number - 1}, keyword=${param.keyword})}">이전</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, members.totalPages - 1)}"
                th:classappend="${i == members.number} ? 'active'">
                <a class="page-link" th:href="@{/admin/members(page=${i}, keyword=${param.keyword})}"
                   th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${members.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/admin/members(page=${members.number + 1}, keyword=${param.keyword})}">다음</a>
            </li>
        </ul>
    </nav>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
