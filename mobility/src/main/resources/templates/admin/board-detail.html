<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobility - 게시글 상세 (관리자)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
    <h2 class="mb-4">게시글 상세 (관리자)</h2>

    <div class="card">
        <div class="card-body">
            <h3 class="card-title" th:text="${board.title}">제목</h3>
            <div class="text-muted small mb-3">
                작성자: <span th:text="${board.member.name}">이름</span>
                (<span th:text="${board.member.userid}">userid</span>) ·
                작성일: <span th:text="${#temporals.format(board.createdAt, 'yyyy-MM-dd HH:mm')}">2026-01-01</span> ·
                조회수: <span th:text="${board.hits}">0</span>
            </div>
            <hr>
            <p class="content-box" th:text="${board.content}">내용</p>
        </div>
    </div>

    <div class="d-flex gap-2 mt-3">
        <a th:href="@{/admin/boards}" class="btn btn-secondary">목록으로</a>
        <a th:href="@{'/admin/boards/edit/' + ${board.id}}" class="btn btn-outline-primary">수정</a>
        <form th:action="@{'/admin/boards/del/' + ${board.id}}" method="post"
              onsubmit="return confirm('정말 삭제하시겠습니까?');">
            <button type="submit" class="btn btn-outline-danger">삭제</button>
        </form>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
