<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobility - 홈</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
    <div class="p-5 mb-4 bg-white rounded-3 shadow-sm text-center">
        <h1 class="display-5 fw-bold">Mobility 게시판에 오신 것을 환영합니다</h1>
        <p class="col-lg-8 mx-auto fs-5 text-muted">
            자유롭게 글을 작성하고 다른 회원들과 소통해보세요.
        </p>
        <div class="d-flex justify-content-center gap-2 mt-4">
            <a th:href="@{/boards/list}" class="btn btn-primary btn-lg">게시판 바로가기</a>
            <a sec:authorize="!isAuthenticated()" th:href="@{/members/register}" class="btn btn-outline-secondary btn-lg">회원가입</a>
            <a sec:authorize="isAuthenticated()" th:href="@{/boards/new}" class="btn btn-outline-primary btn-lg">글쓰기</a>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-md-4">
            <div class="card h-100 p-4 text-center">
                <div class="fs-2 mb-2">📋</div>
                <h5>자유게시판</h5>
                <p class="text-muted small mb-3">회원들이 작성한 글을 확인해보세요.</p>
                <a th:href="@{/boards/list}" class="btn btn-sm btn-outline-primary mt-auto">목록 보기</a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100 p-4 text-center">
                <div class="fs-2 mb-2">👤</div>
                <h5>마이페이지</h5>
                <p class="text-muted small mb-3">내 정보와 활동 내역을 확인하세요.</p>
                <a sec:authorize="isAuthenticated()" th:href="@{/members/mypage}" class="btn btn-sm btn-outline-primary mt-auto">마이페이지</a>
                <a sec:authorize="!isAuthenticated()" th:href="@{/login}" class="btn btn-sm btn-outline-secondary mt-auto">로그인 필요</a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100 p-4 text-center">
                <div class="fs-2 mb-2">✍️</div>
                <h5>글쓰기</h5>
                <p class="text-muted small mb-3">새로운 이야기를 시작해보세요.</p>
                <a sec:authorize="isAuthenticated()" th:href="@{/boards/new}" class="btn btn-sm btn-outline-primary mt-auto">글쓰기</a>
                <a sec:authorize="!isAuthenticated()" th:href="@{/login}" class="btn btn-sm btn-outline-secondary mt-auto">로그인 필요</a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
