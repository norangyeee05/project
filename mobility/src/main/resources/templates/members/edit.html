<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobility - 회원정보 수정</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body p-4">
                    <h3 class="card-title text-center mb-4">회원 정보 수정</h3>

                    <form th:action="@{/members/edit}" method="post" th:object="${member}">
                        <div class="mb-3">
                            <label class="form-label">아이디</label>
                            <input type="text" class="form-control" th:value="${member.userid}" disabled>
                        </div>
                        <div class="mb-3">
                            <label for="name" class="form-label">이름</label>
                            <input type="text" id="name" th:field="*{name}" class="form-control"
                                   maxlength="50" required>
                        </div>
                        <div class="mb-3">
                            <label for="tel" class="form-label">전화번호</label>
                            <input type="text" id="tel" th:field="*{tel}" class="form-control" maxlength="30">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">이메일</label>
                            <input type="email" id="email" th:field="*{email}" class="form-control"
                                   maxlength="120" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">새 비밀번호</label>
                            <input type="password" id="password" name="password" class="form-control"
                                   minlength="8" maxlength="100" placeholder="변경할 경우에만 입력하세요">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">저장</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
