<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobility - 마이페이지</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
    <h2 class="mb-4">마이페이지</h2>

    <div class="card">
        <div class="card-body">
            <table class="table table-borderless mb-0">
                <tbody>
                <tr>
                    <th style="width:150px;">아이디</th>
                    <td th:text="${member.userid}">userid</td>
                </tr>
                <tr>
                    <th>이름</th>
                    <td th:text="${member.name}">이름</td>
                </tr>
                <tr>
                    <th>이메일</th>
                    <td th:text="${member.email}">email</td>
                </tr>
                <tr>
                    <th>전화번호</th>
                    <td th:text="${member.tel}">tel</td>
                </tr>
                <tr>
                    <th>권한</th>
                    <td>
                        <span class="badge"
                              th:classappend="${member.role.name() == 'ADMIN'} ? 'badge-role-admin' : 'badge-role-user'"
                              th:text="${member.role}">USER</span>
                    </td>
                </tr>
                <tr>
                    <th>가입일</th>
                    <td th:text="${#temporals.format(member.createdAt, 'yyyy-MM-dd')}">2026-01-01</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="d-flex gap-2 mt-3">
        <a th:href="@{/members/edit}" class="btn btn-outline-primary">정보 수정</a>
        <a th:href="@{/members/delete}" class="btn btn-outline-danger"
           onclick="return confirm('정말 탈퇴하시겠습니까?');">회원 탈퇴</a>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
