<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobility - 게시판</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">게시판</h2>
        <a sec:authorize="isAuthenticated()" th:href="@{/boards/new}" class="btn btn-primary">글쓰기</a>
    </div>

    <form th:action="@{/boards/list}" method="get" class="row g-2 mb-3">
        <div class="col-auto">
            <input type="text" name="keyword" th:value="${param.keyword}" class="form-control"
                   placeholder="제목 / 내용 / 작성자 검색">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary">검색</button>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th style="width:80px;">번호</th>
                <th>제목</th>
                <th style="width:150px;">작성자</th>
                <th style="width:100px;">조회수</th>
                <th style="width:150px;">작성일</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="b : ${boards.content}">
                <td th:text="${b.id}">1</td>
                <td>
                    <a th:href="@{'/boards/detail/' + ${b.id}}" th:text="${b.title}"
                       class="text-decoration-none">제목</a>
                </td>
                <td th:text="${b.member.name}">작성자</td>
                <td th:text="${b.hits}">0</td>
                <td th:text="${#temporals.format(b.createdAt, 'yyyy-MM-dd')}">2026-01-01</td>
            </tr>
            <tr th:if="${boards.empty}">
                <td colspan="5" class="text-center text-muted py-4">등록된 게시글이 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${boards.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${boards.first} ? 'disabled'">
                <a class="page-link" th:href="@{/boards/list(page=${boards.number - 1}, keyword=${param.keyword})}">이전</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, boards.totalPages - 1)}"
                th:classappend="${i == boards.number} ? 'active'">
                <a class="page-link" th:href="@{/boards/list(page=${i}, keyword=${param.keyword})}"
                   th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${boards.last} ? 'disabled'">
                <a class="page-link" th:href="@{/boards/list(page=${boards.number + 1}, keyword=${param.keyword})}">다음</a>
            </li>
        </ul>
    </nav>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
